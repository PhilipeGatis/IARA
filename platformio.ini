[platformio]
default_envs = esp32dev
; WiFi credentials live in secrets.ini, which is gitignored.
; Copy secrets.ini.example to secrets.ini before the first build.
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/git_version.py

; Serial monitor speed (must match Serial.begin(115200))
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/RTClib @ ^2.1.3
    arduino-libraries/NTPClient @ ^3.2.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.5

; Build flags
build_flags =
    -D USE_WEBSERVER
    ${secrets.build_flags}
    -D AP_SSID='"AquariumController"'
    -D AP_PASSWORD='"aqua1234"'

; ==============================================================================
; Native test environment — runs on host machine (no ESP32 required)
; ==============================================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I test/mocks
    -I include
    -D UNIT_TEST
test_build_src = yes
lib_extra_dirs = test
lib_deps =
lib_ignore =
    RTClib
    NTPClient
    WiFi
    Wire
    Preferences
    Adafruit GFX Library
    Adafruit BusIO
    Adafruit ST7735 and ST7789 Library
build_src_filter =
    +<*>
    -<main.cpp>
    -<WebManager.cpp>
    -<TimeManager.cpp>
    -<DisplayManager.cpp>
test_framework = unity

; ==============================================================================
; Coverage environment — generates gcov/lcov coverage report
; Run: pio test -e coverage && ./scripts/coverage.sh
; ==============================================================================
[env:coverage]
platform = native
build_flags =
    -std=c++17
    -I test/mocks
    -I include
    --coverage
    -O0
    -g
    -D UNIT_TEST
extra_scripts = pre:scripts/add_coverage_link.py
test_build_src = yes
lib_extra_dirs = test
lib_deps =
lib_ignore =
    RTClib
    NTPClient
    WiFi
    Wire
    Preferences
    Adafruit SSD1306
    Adafruit GFX Library
    Adafruit BusIO
build_src_filter =
    +<*>
    -<main.cpp>
    -<WebManager.cpp>
    -<TimeManager.cpp>
    -<DisplayManager.cpp>
test_framework = unity
