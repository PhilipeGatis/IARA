<polyline points="664,400 704,400" class="w" style="stroke: var(--live)"/>
<rect x="704" y="379" width="210" height="42" rx="6" class="n"/><text x="809.0" y="404.0" text-anchor="middle" class="nt">キャニスターコンセント・ライブ</text>
<text x="24" y="462" text-anchor="start" class="l">110/220 Vの接続部はすべて熱収縮チューブで絶縁します。</text>
