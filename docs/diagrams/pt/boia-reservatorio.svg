<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 172" width="697" height="172" role="img" aria-label="Boia do reservatório entre o GPIO19 e o pino GND do ESP32.">
<style>
  svg {
    --bg: #ffffff;
    --ink: #16201a;
    --muted: #5b6a61;
    --edge: #c8d2c8;
    --node: #1d3a2c;
    --node-ink: #dceae1;
    --live: #b4362c;
    --neutral: #22598f;
    --earth: #2c7a51;
    --sig: #6a4b9c;
    --warm: #a96a09;
    --gnd: #55665c;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11160f;
      --ink: #e6ece6;
      --muted: #9aa89f;
      --edge: #333f37;
      --node: #1f4130;
      --node-ink: #d8e6dd;
      --live: #e8776a;
      --neutral: #6ea8e0;
      --earth: #6cc493;
      --sig: #b294e6;
      --warm: #e5a63f;
      --gnd: #9aaaa0;
    }
  }
  .n { fill: var(--node); }
  .nt { fill: var(--node-ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
  .ns { fill: var(--node-ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; opacity: .72; }
  .c { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .ct { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .l { fill: var(--muted); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .lb { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  .w { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dot { stroke: none; }
</style>
<rect x="0" y="0" width="697" height="172" fill="var(--bg)"/>
<rect x="24" y="40" width="160" height="54" rx="6" class="n"/><text x="104.0" y="65.0" text-anchor="middle" class="nt">ESP32</text><text x="104.0" y="80.0" text-anchor="middle" class="ns">GPIO19</text>
<polyline points="184,67 280,67" class="w" style="stroke: var(--sig)"/>
<rect x="280" y="46" width="173" height="42" rx="4" class="c" style="stroke: var(--sig)"/><text x="366.5" y="65.0" text-anchor="middle" class="ct">BOIA</text><text x="366.5" y="79.0" text-anchor="middle" class="l">horizontal · reservatório</text>
<polyline points="453,67 513,67" class="w" style="stroke: var(--gnd)"/>
<rect x="513" y="40" width="160" height="54" rx="6" class="n"/><text x="593.0" y="65.0" text-anchor="middle" class="nt">ESP32 GND</text><text x="593.0" y="80.0" text-anchor="middle" class="ns">pino da placa</text>
<text x="24" y="130" text-anchor="start" class="l">INPUT_PULLUP, ativo em LOW: reservatório cheio fecha o contato.</text>
<text x="24" y="152" text-anchor="start" class="l">Os dois fios saem juntos no mesmo cabo, o caminho todo, e o GND é o pino do ESP32 — nunca o borne da fonte.</text>
</svg>
