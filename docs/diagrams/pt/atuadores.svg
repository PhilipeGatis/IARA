<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Canal MOSFET e GND do barramento chegando à bomba por fios de 1,2 metro, com o diodo flyback instalado junto ao motor.">
<style>
  svg {
    --bg: #ffffff;
    --ink: #16201a;
    --muted: #5b6a61;
    --edge: #c8d2c8;
    --node: #1d3a2c;
    --node-ink: #dceae1;
    --live: #b4362c;
    --neutral: #22598f;
    --earth: #2c7a51;
    --sig: #6a4b9c;
    --warm: #a96a09;
    --gnd: #55665c;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11160f;
      --ink: #e6ece6;
      --muted: #9aa89f;
      --edge: #333f37;
      --node: #1f4130;
      --node-ink: #d8e6dd;
      --live: #e8776a;
      --neutral: #6ea8e0;
      --earth: #6cc493;
      --sig: #b294e6;
      --warm: #e5a63f;
      --gnd: #9aaaa0;
    }
  }
  .n { fill: var(--node); }
  .nt { fill: var(--node-ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
  .ns { fill: var(--node-ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; opacity: .72; }
  .c { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .ct { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .l { fill: var(--muted); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .lb { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  .w { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dot { stroke: none; }
</style>
<rect x="0" y="0" width="640" height="320" fill="var(--bg)"/>
<rect x="24" y="60" width="168" height="52" rx="6" class="n"/><text x="108.0" y="84.0" text-anchor="middle" class="nt">CANAL MOSFET</text><text x="108.0" y="99.0" text-anchor="middle" class="ns">saída do módulo</text>
<polyline points="192,86 330,86" class="w" style="stroke: var(--live)"/>
<text x="196" y="72" text-anchor="start" class="l">fio de 1,2 m</text>
<polyline points="330,86 470,86" class="w" style="stroke: var(--live)"/>
<circle cx="330" cy="86" r="3.5" class="dot" style="fill: var(--live)"/>
<rect x="470" y="60" width="130" height="108" rx="6" class="n"/><text x="535.0" y="112.0" text-anchor="middle" class="nt">BOMBA</text><text x="535.0" y="127.0" text-anchor="middle" class="ns">12 V</text>
<text x="462" y="82" text-anchor="end" class="lb">+</text>
<text x="462" y="232" text-anchor="end" class="lb">−</text>
<polyline points="330,86 330,140" class="w" style="stroke: var(--warm)"/>
<rect x="255.0" y="140" width="150" height="40" rx="4" class="c" style="stroke: var(--warm)"/><text x="330.0" y="164.0" text-anchor="middle" class="ct">DIODO FLYBACK</text>
<polyline points="330,180 330,236" class="w" style="stroke: var(--warm)"/>
<circle cx="330" cy="236" r="3.5" class="dot" style="fill: var(--gnd)"/>
<rect x="24" y="210" width="168" height="52" rx="6" class="n"/><text x="108.0" y="234.0" text-anchor="middle" class="nt">GND BARRAMENTO</text><text x="108.0" y="249.0" text-anchor="middle" class="ns">borne V− da fonte</text>
<polyline points="192,236 470,236" class="w" style="stroke: var(--gnd)"/>
<polyline points="470,236 470,140" class="w" style="stroke: var(--gnd)"/>
<text x="24" y="300" text-anchor="start" class="l">O diodo vai na ponta do fio, junto ao motor: no meio do cabo, o 1,2 m irradia o ruído como antena.</text>
</svg>
