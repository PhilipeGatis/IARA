<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="650" height="360" role="img" aria-label="A02YYUW ultrasonic sensor wired to the ESP32: VCC at 3.3 volts, TX on GPIO34 with a 10 kilo-ohm pull-up, RX tied to 3.3 volts and GND on the board pin.">
<style>
  svg {
    --bg: #ffffff;
    --ink: #16201a;
    --muted: #5b6a61;
    --edge: #c8d2c8;
    --node: #1d3a2c;
    --node-ink: #dceae1;
    --live: #b4362c;
    --neutral: #22598f;
    --earth: #2c7a51;
    --sig: #6a4b9c;
    --warm: #a96a09;
    --gnd: #55665c;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #11160f;
      --ink: #e6ece6;
      --muted: #9aa89f;
      --edge: #333f37;
      --node: #1f4130;
      --node-ink: #d8e6dd;
      --live: #e8776a;
      --neutral: #6ea8e0;
      --earth: #6cc493;
      --sig: #b294e6;
      --warm: #e5a63f;
      --gnd: #9aaaa0;
    }
  }
  .n { fill: var(--node); }
  .nt { fill: var(--node-ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
  .ns { fill: var(--node-ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; opacity: .72; }
  .c { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .ct { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .l { fill: var(--muted); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
  .lb { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  .w { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dot { stroke: none; }
</style>
<rect x="0" y="0" width="650" height="360" fill="var(--bg)"/>
<rect x="24" y="40" width="150" height="220" rx="6" class="n"/><text x="99.0" y="148.0" text-anchor="middle" class="nt">ESP32</text><text x="99.0" y="163.0" text-anchor="middle" class="ns">3.3 V logic</text>
<rect x="470" y="40" width="156" height="220" rx="6" class="n"/><text x="548.0" y="148.0" text-anchor="middle" class="nt">A02YYUW</text><text x="548.0" y="163.0" text-anchor="middle" class="ns">waterproof · UART</text>
<text x="186" y="74" text-anchor="start" class="lb">3V3</text>
<polyline points="174,80 470,80" class="w" style="stroke: var(--live)"/>
<text x="462" y="74" text-anchor="end" class="l">VCC (red)</text>
<text x="186" y="134" text-anchor="start" class="lb">GPIO34</text>
<polyline points="174,140 470,140" class="w" style="stroke: var(--sig)"/>
<text x="462" y="134" text-anchor="end" class="l">TX (data)</text>
<text x="186" y="190" text-anchor="start" class="lb">3V3</text>
<polyline points="174,196 470,196" class="w" style="stroke: var(--live)"/>
<text x="462" y="190" text-anchor="end" class="l">RX (control)</text>
<text x="186" y="234" text-anchor="start" class="lb">GND</text>
<polyline points="174,240 470,240" class="w" style="stroke: var(--gnd)"/>
<text x="462" y="234" text-anchor="end" class="l">GND (black)</text>
<polyline points="300,80 300,104" class="w" style="stroke: var(--warm)"/>
<circle cx="300" cy="80" r="3.5" class="dot" style="fill: var(--warm)"/>
<rect x="252" y="104" width="96" height="36" rx="4" class="c" style="stroke: var(--warm)"/><text x="300.0" y="126.0" text-anchor="middle" class="ct">10 kΩ</text>
<circle cx="300" cy="140" r="3.5" class="dot" style="fill: var(--warm)"/>
<text x="24" y="296" text-anchor="start" class="l">Never power it from 5 V: the output level follows VCC and would destroy GPIO34.</text>
<text x="24" y="318" text-anchor="start" class="l">The 10 kΩ pull-up is mandatory — GPIO34 is input-only and has no internal pull-up.</text>
<text x="24" y="340" text-anchor="start" class="l">9600 8N1, 4-byte frame: 0xFF, DataH, DataL, checksum. Distance in millimetres.</text>
</svg>
